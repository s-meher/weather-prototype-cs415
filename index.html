<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-page">

        <h1>Chicago Weather</h1>
        <p class="intro">A quick check before I go outside.</p>


        <div class="section">
            <h2>Current Weather</h2>
            <p id="temperature">Loading...</p>
            <p id="condition"></p>
            <p id="feels-like"></p>
        </div>


        <div class="section">
            <h2>Do I need an umbrella?</h2>
            <p id="umbrella-answer">Checking...</p>
            <p id="rain-chance"></p>
        </div>


        <div class="section">
            <h2>Can I go for a run?</h2>
            <p id="run-answer">Checking...</p>
            <p id="run-detail"></p>
        </div>


        <div class="section">
            <h2>What should I wear?</h2>
            <p id="clothing-answer">Checking...</p>
            <p id="clothing-detail"></p>
        </div>


        <button id="refresh-button">Refresh</button>

        <p id="updated-time"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
